name: Daily live policy
on:
  schedule:
    # Primary Denver midnight release, with bounded missed-event recovery.
    # The UTC backup also avoids relying exclusively on timezone triggers.
    - cron: '23 20 * * *'
      timezone: America/Denver
    - cron: '39 20 * * *'
      timezone: America/Denver
    - cron: '39 21 * * *'
      timezone: America/Denver
    - cron: '59 1 * * *'
      timezone: America/Denver
    - cron: '5 9 * * *'
  workflow_dispatch:
    inputs:
      recover_missed_daily:
        description: 'Owner-only checked recovery of a missed daily release'
        type: boolean
        required: true
        default: false
      manual_release:
        description: 'Owner-authorized additional checked release'
        type: boolean
        required: false
        default: false
      expected_main_sha:
        description: 'Exact reviewed main SHA for an additional release'
        type: string
        required: false
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: daily-live-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    name: release-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require PRs to target main
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: test "$BASE_BRANCH" = main
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test .github/release/promote-live.test.mjs

  promote:
    name: scheduled-live-promotion
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && (inputs.recover_missed_daily == true || inputs.manual_release == true) && github.actor == 'christcr2012' && github.triggering_actor == 'christcr2012'))
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Checked daily fast-forward only
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER_MISSED_DAILY: ${{ inputs.recover_missed_daily }}
          MANUAL_RELEASE: ${{ inputs.manual_release }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: node .github/release/promote-live.mjs
