name: Import official Vercel OpenAPI snapshot (one-time)
on:
  push:
    branches:
      - ai/gpt6/save-vercel-openapi-2026-10-11
    paths:
      - .github/workflows/import-vercel-openapi-once.yml

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'Robinson-AI-Systems/vercel-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact upstream JSON, document it, and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/vercel-openapi
          curl --fail --location --silent --show-error --retry 2 --max-time 180 \
            https://vercel.com/openapi.json \
            --output vendor/vercel-openapi/openapi-2026-10-11.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path = 'vendor/vercel-openapi/openapi-2026-10-11.json';
          const bytes = fs.readFileSync(path);
          const doc = JSON.parse(bytes.toString('utf8'));
          if (!/^3\./.test(doc.openapi ?? '') || !doc.info || !doc.paths || typeof doc.paths !== 'object') {
            throw new Error('Source is not a complete OpenAPI 3 document');
          }
          const methods = new Set(['get', 'post', 'put', 'patch', 'delete', 'head', 'options', 'trace']);
          let operations = 0;
          for (const item of Object.values(doc.paths)) {
            if (item && typeof item === 'object') {
              for (const method of Object.keys(item)) if (methods.has(method)) operations++;
            }
          }
          if (operations < 100 || bytes.length < 1000000) throw new Error('OpenAPI response is unexpectedly small');
          const sha = crypto.createHash('sha256').update(bytes).digest('hex');
          const timestamp = new Date().toISOString();
          fs.writeFileSync('vendor/vercel-openapi/SOURCE.md',
            '# Vercel REST OpenAPI snapshot\n\n' +
            '- Source: https://vercel.com/openapi.json\n' +
            '- Retrieved (UTC): ' + timestamp + '\n' +
            '- Saved file: `openapi-2026-10-11.json`\n' +
            '- SHA-256: `' + sha + '`\n' +
            '- Operation count (HTTP methods under paths): ' + operations + '\n' +
            '- Size (bytes): ' + bytes.length + '\n\n' +
            'The JSON file is preserved byte-for-byte from the published URL, without SDK reconstruction or formatting changes. This is a dated reference snapshot, not an automatically updated API contract.\n');
          console.log('Vercel OpenAPI snapshot imported:', operations, 'operations,', bytes.length, 'bytes, SHA-256', sha);
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/vercel-openapi/openapi-2026-10-11.json vendor/vercel-openapi/SOURCE.md
          git rm .github/workflows/import-vercel-openapi-once.yml
          git commit -m "docs: vendor verified official Vercel OpenAPI snapshot"
          git push origin HEAD:ai/gpt6/save-vercel-openapi-2026-10-11
